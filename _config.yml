# Site settings
title: Engel Sanchez
tagline: Software pro, music hobbyist
description: >-
  Personal home page of Engel Sanchez — writing about software,
  distributed systems, music and whatever else is holding my attention.
url: "https://www.engelsanchez.net"
baseurl: ""

# Shown next to the bio on the home page
author:
  name: Engel Sanchez
  photo: /assets/images/EngelHoldingMando.svg
  photo_alt: "Illustration of Engel Sanchez holding Mando"
  email: engel.sanchez@gmail.com
  github: engelsanchez

# Build settings
markdown: kramdown
permalink: /blog/:year/:month/:day/:title/

kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - CLAUDE.md
